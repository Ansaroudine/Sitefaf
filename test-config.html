<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Configuration IA FAYDA</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Configuration IA FAYDA</h1>
    
    <div id="test-results"></div>
    
    <h2>📋 Instructions de test :</h2>
    <ol>
        <li>Ouvrez la console développeur (F12)</li>
        <li>Rechargez cette page</li>
        <li>Vérifiez les messages dans la console</li>
        <li>Regardez les résultats ci-dessous</li>
    </ol>

    <script src="fayda-config.js"></script>
    <script src="fayda-api-key.js"></script>
    
    <script>
        function runTests() {
            const results = document.getElementById('test-results');
            let html = '';
            
            // Test 1: Vérifier FAYDA_CONFIG
            if (window.FAYDA_CONFIG) {
                html += '<div class="test-result success">✅ FAYDA_CONFIG chargé</div>';
            } else {
                html += '<div class="test-result error">❌ FAYDA_CONFIG non trouvé</div>';
            }
            
            // Test 2: Vérifier la configuration OpenAI
            if (window.FAYDA_CONFIG && window.FAYDA_CONFIG.openai) {
                html += '<div class="test-result success">✅ Configuration OpenAI trouvée</div>';
            } else {
                html += '<div class="test-result error">❌ Configuration OpenAI manquante</div>';
            }
            
            // Test 3: Vérifier la clé API
            if (window.FAYDA_CONFIG && window.FAYDA_CONFIG.openai && window.FAYDA_CONFIG.openai.apiKey) {
                const keyPreview = window.FAYDA_CONFIG.openai.apiKey.substring(0, 10) + '...';
                html += `<div class="test-result success">✅ Clé API configurée: ${keyPreview}</div>`;
            } else {
                html += '<div class="test-result error">❌ Clé API manquante</div>';
            }
            
            // Test 4: Vérifier le modèle
            if (window.FAYDA_CONFIG && window.FAYDA_CONFIG.openai && window.FAYDA_CONFIG.openai.model) {
                html += `<div class="test-result success">✅ Modèle configuré: ${window.FAYDA_CONFIG.openai.model}</div>`;
            } else {
                html += '<div class="test-result warning">⚠️ Modèle non configuré</div>';
            }
            
            // Test 5: Vérifier les tokens max
            if (window.FAYDA_CONFIG && window.FAYDA_CONFIG.openai && window.FAYDA_CONFIG.openai.maxTokens) {
                html += `<div class="test-result success">✅ Tokens max: ${window.FAYDA_CONFIG.openai.maxTokens}</div>`;
            } else {
                html += '<div class="test-result warning">⚠️ Tokens max non configurés</div>';
            }
            
            results.innerHTML = html;
            
            // Afficher la configuration complète dans la console
            console.log('🔍 Configuration complète:', window.FAYDA_CONFIG);
        }
        
        // Lancer les tests après le chargement
        setTimeout(runTests, 100);
    </script>
</body>
</html>
